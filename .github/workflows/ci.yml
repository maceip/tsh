name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------------
  # Linux: full CI via xtask (fmt + clippy + tests + shell harness + binary)
  # -----------------------------------------------------------------------
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run full CI suite via xtask
        run: cargo run -p xtask -- ci

  # -----------------------------------------------------------------------
  # Windows: CI via xtask (fmt + clippy + lib tests, POSIX tests skipped)
  # -----------------------------------------------------------------------
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Windows CI suite via xtask
        run: cargo run -p xtask -- ci

  # -----------------------------------------------------------------------
  # Docker: build the multi-stage image to verify it compiles cleanly
  # -----------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tsh:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
