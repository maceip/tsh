[workspace]
resolver = "2"
members = [
    "crates/langextract-host",
    "crates/tsh",
    "crates/tsh-model-manager",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tokio = { version = "1.36", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
xshell = "0.2"
