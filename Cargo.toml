[workspace]
resolver = "2"
members = [
    "crates/langextract-host",
    "crates/tsh",
    "crates/tsh-model-manager",
    "xtask",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tokio = { version = "1.36", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
brush-builtins = "0.1"
brush-core = "0.4"
brush-interactive = { version = "0.3", features = ["minimal"] }
xshell = "0.2"

# All 4 brush crates from our fork at brush-shell-v0.3.0 tag (internally consistent).
[patch.crates-io]
brush-core = { path = "vendor/brush/brush-core" }
brush-parser = { path = "vendor/brush/brush-parser" }
brush-builtins = { path = "vendor/brush/brush-builtins" }
brush-interactive = { path = "vendor/brush/brush-interactive" }
