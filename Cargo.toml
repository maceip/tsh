[workspace]
resolver = "2"
members = [
    "crates/langextract-host",
    "crates/tsh",
    "crates/tsh-model-manager",
    "xtask",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tokio = { version = "1.36", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
brush-builtins = "0.1"
brush-core = "0.4"
brush-interactive = { version = "0.3", features = ["minimal"] }
xshell = "0.2"

# Use our fork of brush-core with execution observer support
[patch.crates-io]
brush-core = { path = "vendor/brush/brush-core" }
brush-parser = { path = "vendor/brush/brush-parser" }
